name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (deb, AppImage, rpm)
            slug: linux-x64
            platform: ubuntu-24.04
            targets: ''
            args: ''
          - name: macOS arm64 (dmg)
            slug: macos-arm64
            platform: macos-latest
            targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: Windows x64 (msi, exe)
            slug: windows-x64
            platform: windows-latest
            targets: ''
            args: ''

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tauri/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target
          key: ${{ matrix.slug }}

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: tauri
        run: pnpm install --no-frozen-lockfile

      - name: Disable updater artifacts when no signing key is configured
        working-directory: tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"
            echo "No TAURI_SIGNING_PRIVATE_KEY secret: building installers without updater artifacts."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        with:
          projectPath: tauri
          tagName: ${{ github.ref_name }}
          releaseName: PII GUI ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ### Installers

            | Platform | File |
            | --- | --- |
            | Windows x64 | `PII.GUI_0.1.3_x64-setup.exe`, `PII.GUI_0.1.3_x64_en-US.msi` |
            | macOS Apple Silicon | `PII.GUI_0.1.3_aarch64.dmg` |
            | Linux x64 | `PII.GUI_0.1.3_amd64.deb`, `PII.GUI_0.1.3_amd64.AppImage`, `PII.GUI-0.1.3-1.x86_64.rpm` |

            macOS builds are Apple Silicon only: the ONNX Runtime build this app links has no prebuilt x86_64 macOS binary, so no Intel dmg is produced.

            The builds are unsigned. macOS Gatekeeper and Windows SmartScreen will warn on first launch.

            ### Changes since v0.1.2

            - Added a CI workflow that runs the frontend typecheck, build and unit tests plus the Rust test suite on every push to main and on pull requests.
            - Detection: Korean resident and foreigner registration numbers, Japanese My Number, corporate and postal identifiers, Korean and Japanese phone numbers, credit card numbers with Luhn validation, and AWS, GitHub, JWT and complete PEM private-key patterns.
            - PDF export: the exported PDF is rescanned and a scoped verification report is produced.
            - Fixed Rust detection offsets for Cyrillic text, the git blob hash used in tests, and masked phone numbers that kept a leading `+`.
            - Regenerated the pnpm lockfile so frozen installs work on a fresh clone, and added test coverage for the base64 export helpers, the pdfjs setup, the `cn` helper and locale / PII rule drift.
            - Documentation: CONTRIBUTING, SECURITY, CODE_OF_CONDUCT and issue templates.

            Thanks to @tahodev for eleven pull requests and @Avlakan for the Cyrillic offset fix.
