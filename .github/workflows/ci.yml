name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tauri/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Unit tests with coverage
        run: pnpm test:unit:coverage
      - name: Typecheck and build
        run: pnpm build

  quality:
    name: Frontend (format, lint; advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tauri/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      # Advisory until the one-time `pnpm format` cleanup and lint fixes land.
      - name: Prettier check
        continue-on-error: true
        run: pnpm format:check
      - name: ESLint
        continue-on-error: true
        run: pnpm lint

  rust:
    name: Rust backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - name: Tests
        run: cargo test --all-targets
      - name: Clippy (warnings only)
        run: cargo clippy --all-targets
      - name: Formatting (advisory)
        continue-on-error: true
        run: cargo fmt --check
